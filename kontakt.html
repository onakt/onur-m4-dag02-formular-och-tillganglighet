<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boka bord – Kafé Kardemumma</title>
</head>

<body>
  <header>
    <h1>Kafé Kardemumma</h1>
    <nav aria-label="Huvudmeny">
      <ul>
        <li><a href="index.html">Startsida</a></li>
        <li><a href="index.html#meny">Meny</a></li>
        <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Boka bord</h2>
    <!-- TODO: Skriv ingressen från innehall.md -->
    <p>Fyll i formuläret så bekräftar vi din bokning inom ett dygn. Fält markerade med * är obligatoriska.</p>
    <form action="#" method="post">
      <!-- TODO 1: fält för namn, e-post, telefon, datum (label + input med for/id) -->
      <div class="falt">
        <label for="namn">Namn *</label>
        <input type="text" id="namn" name="namn" autocomplete="name" placeholder="Ditt namn" required>
      </div>

      <div class="falt">
        <label for="epost">E-postadress *</label>
        <input type="email" id="epost" name="epost" autocomplete="email" placeholder="namn@exempel.com" required>
      </div>

      <div class="falt">
        <label for="telefon">Telefon</label>
        <input type="tel" id="telefon" name="telefon" autocomplete="tel" placeholder="073 123 45 67">
      </div>

      <div class="falt">
        <label for="datum">Datum *</label>
        <input type="date" id="datum" name="datum" required>
      </div>
      <!-- TODO 2: rullista för antal personer, textarea för önskemål -->
      <label for="antal">Antal personer *</label>
      <select id="antal" name="antal" required>
        <option value="">Välj antal</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>

      <label for="onskemal">Övriga önskemål</label>
      <textarea id="onskemal" name="onskemal" rows="4"></textarea>
      <!-- TODO 3: fieldset + legend för kostönskemål och bekräftelsesätt -->
      <fieldset>
        <legend>Kostönskemål</legend>

        <input type="checkbox" id="veg" name="kost" value="veg">
        <label for="veg">Vegetarisk</label>

        <input type="checkbox" id="vegan" name="kost" value="vegan">
        <label for="vegan">Vegensk</label>

        <input type="checkbox" id="glutenfri" name="kost" value="glutenfri">
        <label for="glutenfri">Glutenfri</label>
      </fieldset>

      <fieldset>
        <legend>Hur vill du få bekräftelsen? *</legend>

        <input type="radio" id="kontakt-email" name="kontakt" value="epost" required>
        <label for="kontakt-email">E-post</label>

        <input type="radio" id="kontakt-sms" name="kontakt" value="sms">
        <label for="kontakt-sms">SMS</label>
      </fieldset>
      <!-- TODO 4: samtyckeskryssruta (required) och skickaknapp -->
      <input type="checkbox" id="samtycke" name="samtycke" value="samtycke" required>
      <label for="samtycke">Jag godkänner att Kafé Kardemumma sparar mina uppgifter för bokningen. *</label>

      <button type="submit">Skicka bokning</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Kafé Kardemumma</p>
    <address>
      Fiktivgatan 1, 111 11 Stockholm<br>
      <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
    </address>
  </footer>
</body>

</html>
