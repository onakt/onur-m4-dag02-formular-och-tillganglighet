<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
  <header>
    <h1>Kafé Kardemumma</h1>
    <nav aria-label="Huvudmeny">
      <ul>
        <li><a href="index.html">Startsida</a></li>
        <li><a href="index.html#meny">Meny</a></li>
        <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Boka bord</h2>
    <!-- TODO: Skriv ingressen från innehall.md -->
    <p>Fyll i formuläret så bekräftar vi din bokning inom ett dygn. Fält markerade med * är obligatoriska.</p>
    <form action="#" method="post">
      <!-- TODO 1: fält för namn, e-post, telefon, datum (label + input med for/id) -->
      <div class="falt">
        <label for="namn">Namn</label>
        <input type="text" id="namn" name="namn" autocomplete="name" placeholder="Ditt namn">
      </div>

      <div class="falt">
        <label for="epost">E-postadress</label>
        <input type="email" id="epost" name="epost" autocomplete="email" placeholder="namn@exempel.com">
      </div>

      <div class="falt">
        <label for="telefon">Telefon</label>
        <input type="tel" id="telefon" name="telefon" autocomplete="tel" placeholder="073 123 45 67">
      </div>

      <div class="falt">
        <label for="datum">Datum</label>
        <input type="date" id="datum" name="datum">
      </div>
      <!-- TODO 2: rullista för antal personer, textarea för önskemål -->
      <!-- TODO 3: fieldset + legend för kostönskemål och bekräftelsesätt -->
      <!-- TODO 4: samtyckeskryssruta (required) och skickaknapp -->
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Kafé Kardemumma</p>
    <address>
      Fiktivgatan 1, 111 11 Stockholm<br>
      <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
    </address>
  </footer>
</body>

</html>
